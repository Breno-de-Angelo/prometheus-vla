<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniView LIVE — G1 teleop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14; --bg2:#0d121b; --panel:#11161f; --panel2:#141b26; --panelhi:#172030;
  --line:#1e2630; --line2:#2b3543; --line3:#384556;
  --ink:#e6edf6; --ink2:#9fb0c3; --ink3:#647285; --ink4:#48566a;
  --cmd:#22d3ee; --filt:#f59e0b; --exec:#34d399;
  --active:#38bdf8; --mask:#5b6675; --bad:#f6708a; --real:#7dd3fc;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#root{height:100vh;width:100vw}
button{font-family:inherit;cursor:pointer}
.mono{font-family:var(--mono)}

/* ---------- loading ---------- */
.boot{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--ink2)}
.boot .ring{width:42px;height:42px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--active);animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.boot .bt{font-family:var(--mono);font-size:13px;letter-spacing:.04em}
.boot .bt b{color:var(--active)}
.boot.err{color:var(--bad)}

/* =========================================================== GRID */
.grid-view{height:100vh;display:flex;flex-direction:column;
  background-image:radial-gradient(1200px 500px at 85% -15%, rgba(56,189,248,.06), transparent 60%);}
.grid-top{display:flex;align-items:center;justify-content:space-between;padding:18px 26px;border-bottom:1px solid var(--line);flex:none}
.gt-title{font-size:20px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.logo-dot{width:11px;height:11px;border-radius:3px;background:linear-gradient(135deg,var(--active),var(--exec));box-shadow:0 0 14px rgba(56,189,248,.5)}
.gt-sub{font-size:11.5px;color:var(--ink3);margin-top:3px;letter-spacing:.02em}
.gt-chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:11px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 10px}
.chip b{color:var(--ink)}
.chip.dimchip{color:var(--ink3)}
.tiles{flex:1;min-height:0;overflow-y:auto;display:grid;gap:14px;padding:20px 26px 30px;align-content:start}
.tile{position:relative;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:#0b0f16;
  cursor:pointer;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.tile::before{content:'';display:block;padding-bottom:56.6%}
.tile:hover{transform:translateY(-3px);border-color:var(--line3);box-shadow:0 12px 34px rgba(0,0,0,.5)}
.tile.active{border-color:rgba(56,189,248,.5);box-shadow:0 0 0 1px rgba(56,189,248,.25),0 14px 38px rgba(0,0,0,.55)}
.tile.real{border-color:rgba(125,211,252,.4)}
.tile-media{position:absolute;inset:0;overflow:hidden;background:#0b0f16}
.tile-poster{width:100%;height:100%;object-fit:contain;display:block;filter:saturate(.96)}
.sweep-video{visibility:hidden}
.tile-skel{position:absolute;inset:0;background:linear-gradient(100deg,#0d131c 30%,#141d29 50%,#0d131c 70%);background-size:200% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.sweep-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;z-index:1}
.tile-scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.06) 3px 4px);mix-blend-mode:overlay;z-index:2}
.tile-overlay{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:space-between;padding:9px;
  background:linear-gradient(180deg,rgba(8,11,17,.55),transparent 26%,transparent 64%,rgba(8,11,17,.72))}
.tile-top{display:flex;align-items:center;justify-content:space-between}
.tile-id{font-size:11px;color:#dbe6f2;text-shadow:0 1px 3px rgba(0,0,0,.7);letter-spacing:.04em}
.tag-real{font-size:9px;color:#06121c;background:var(--real);padding:2px 6px;border-radius:5px;font-weight:600;letter-spacing:.06em}
.tag-demo{font-size:9px;color:var(--ink2);background:rgba(8,12,18,.6);border:1px solid var(--line2);padding:2px 6px;border-radius:5px;letter-spacing:.06em}
.tile-bottom{display:flex;align-items:center;gap:7px}
.tile-dur{font-size:11px;color:#cfdbe8;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.tile-flag{font-size:9.5px;color:#fcd34d;letter-spacing:.03em}
.tile-play{margin-left:auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#0a0e14;
  background:rgba(231,238,246,.92);opacity:0;transform:scale(.8);transition:.16s}
.tile:hover .tile-play,.tile.active .tile-play{opacity:1;transform:scale(1)}

/* =========================================================== DETAIL */
.detail-view{height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.detail-top{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);flex:none}
.back-btn{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--ink2);
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px}
.back-btn:hover{color:var(--ink);border-color:var(--line3)}
.dt-id{display:flex;align-items:center;gap:8px}
.dt-ep{font-size:15px;color:var(--ink);font-weight:600;letter-spacing:.03em}
.dt-task{font-size:14px;color:var(--ink2)}
.dt-meta{font-size:11.5px;color:var(--ink3)}
.dt-spacer{flex:1}
.detail-grid{flex:1;min-height:0;display:grid;gap:12px;padding:14px 18px}
.cell{min-width:0;min-height:0;display:flex}
.cell>*{flex:1;min-width:0;min-height:0}
/* layout A — inspector */
.layout-a .detail-grid{grid-template-columns:1fr 1fr 1fr 0.94fr;grid-template-rows:minmax(0,1.08fr) minmax(0,0.92fr);
  grid-template-areas:"rgb depth traj tactile" "ramps ramps ramps tactile";}
/* layout B — telemetry first */
.layout-b .detail-grid{grid-template-columns:0.8fr 1.5fr 0.82fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr) minmax(0,0.85fr);
  grid-template-areas:"rgb traj tactile" "depth traj tactile" "ramps ramps ramps";}
/* layout C — analysis */
.layout-c .detail-grid{grid-template-columns:1.55fr 0.82fr;grid-template-rows:1fr 1fr 1fr 1fr;
  grid-template-areas:"ramps rgb" "ramps depth" "ramps traj" "ramps tactile";}
.cell-rgb{grid-area:rgb}.cell-depth{grid-area:depth}.cell-traj{grid-area:traj}.cell-ramps{grid-area:ramps}.cell-tactile{grid-area:tactile}

/* panels */
.panel,.media-panel{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel-head,.media-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none;background:linear-gradient(180deg,var(--panel2),var(--panel))}
.ph-label,.mh-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase}
.ph-meta,.mh-meta{font-family:var(--mono);font-size:10px;color:var(--ink4)}
.media-body{position:relative;flex:1;min-height:0;background:#06090e;display:flex;align-items:center;justify-content:center;overflow:hidden}
.rgb-video,.rgb-canvas,.depth-img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;display:block}
.depth-img.raw{image-rendering:pixelated;filter:contrast(1.05)}
.real-badge{position:absolute;top:9px;right:9px;font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:#06121c;background:var(--real);padding:2px 7px;border-radius:5px;font-weight:600}
.scanline{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.05) 3px 4px)}
/* depth */
.depth-body{cursor:crosshair}
.depth-cross{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.depth-cross::before,.depth-cross::after{content:"";position:absolute;background:rgba(255,255,255,.85)}
.depth-cross::before{width:17px;height:1px;left:-8px;top:0}
.depth-cross::after{height:17px;width:1px;top:-8px;left:0}
.dc-read{position:absolute;left:11px;top:-7px;font-family:var(--mono);font-size:10px;color:#0a0e14;background:rgba(231,238,246,.95);padding:1px 5px;border-radius:4px;white-space:nowrap}
.depth-frame-note{position:absolute;left:9px;bottom:9px;font-family:var(--mono);font-size:9px;color:var(--ink2);background:rgba(8,12,18,.6);padding:2px 6px;border-radius:5px}
.depth-scale{position:absolute;right:9px;bottom:9px;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;color:var(--ink2)}
.ds-bar{width:64px;height:7px;border-radius:4px;background:linear-gradient(90deg,#e5443a,#f59e0b,#facc15,#34d399,#22d3ee,#3b82f6)}
/* traj */
.traj-panel .traj-wrap{flex:1;min-height:0}
.traj-wrap{position:relative;width:100%;height:100%}
.traj-canvas{width:100%;height:100%;display:block;touch-action:none}
.traj-legend{position:absolute;top:9px;left:11px;display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:9.5px;color:var(--ink2)}
.traj-legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.traj-legend i{width:14px;height:2.5px;border-radius:2px;flex:none}
.traj-legend i.dash{background:none!important;border-top:2px dashed #f59e0b;height:0}
.traj-hint{position:absolute;bottom:8px;right:10px;font-family:var(--mono);font-size:9px;color:var(--ink4)}
/* ramps */
.ramps-panel{min-height:0}
.ramps-panel .panel-head{flex-wrap:wrap;gap:8px}
.rg-tabs{display:flex;gap:5px;flex-wrap:wrap}
.rg-tab{font-family:var(--mono);font-size:10.5px;color:var(--ink2);background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:5px 9px}
.rg-tab.on{color:#06121c;background:var(--active);border-color:var(--active);font-weight:600}
.rg-tab.masked{color:var(--ink4)}
.rg-tab.masked.on{background:var(--mask);border-color:var(--mask);color:#0a0e14}
.rg-legend{display:flex;gap:4px}
.sig-tog{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--ink3);background:transparent;border:1px solid var(--line);border-radius:7px;padding:4px 8px}
.sig-tog.on{color:var(--ink)}
.sig-tog i{width:11px;height:11px;border-radius:3px;border:1.5px solid}
.ramps-canvas{flex:1;min-height:0;width:100%;display:block;cursor:crosshair}
.ramps-foot{flex:none;padding:5px 12px;border-top:1px solid var(--line);font-size:9px;color:var(--ink4);background:var(--panel2)}

/* tactile */
.tactile-panel .tactile-body{flex:1;min-height:0;display:flex;gap:8px;padding:8px}
.tactile-panel .tactile-body.stack{flex-direction:column}
.hand-card{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;border:1px solid var(--line);border-radius:10px;
  background:radial-gradient(120% 90% at 50% 0%,rgba(40,80,140,.06),transparent 60%),#090d13;padding:7px 7px 4px;transition:border-color .15s,box-shadow .15s}
.hand-card.sel{border-color:rgba(56,189,248,.5);box-shadow:0 0 0 1px rgba(56,189,248,.22),0 10px 30px rgba(0,0,0,.4)}
.hand-card.masked{opacity:.92}
.hc-head{display:flex;align-items:center;justify-content:space-between;font-size:9.5px;letter-spacing:.05em;color:var(--ink2)}
.hc-head em{font-style:normal;color:var(--filt);opacity:.85}
.hc-live{color:var(--exec)}
.hand-card.masked .hc-live{color:var(--ink4)}
.hand-canvas-wrap{flex:1;min-height:0;position:relative}
.hand-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* dof map */
.dofmap{display:flex;gap:9px}
.dof-seg{display:flex;flex-direction:column;gap:4px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.dof-seg.masked{opacity:.62;background:repeating-linear-gradient(45deg,rgba(91,102,117,.06) 0 5px,transparent 5px 10px),var(--panel)}
.dof-seg.sel{border-color:var(--active);box-shadow:0 0 0 1px rgba(56,189,248,.25)}
.dof-lab{font-size:9px;color:var(--ink2);letter-spacing:.03em}
.dof-lab em{color:var(--filt);font-style:normal}
.dof-seg.active .dof-lab{color:var(--ink)}
.dof-cells{display:flex;gap:3px}
.dof-cell{width:9px;height:9px;border-radius:2px;background:var(--line3)}
.dof-seg.active .dof-cell{background:var(--active)}
.dof-seg.masked .dof-cell{background:var(--mask);opacity:.5}

/* transport */
.transport{display:flex;align-items:center;gap:14px;padding:11px 22px;border-top:1px solid var(--line);flex:none;background:linear-gradient(180deg,var(--bg),var(--bg2))}
.tp-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#06121c;background:var(--active);border:none;box-shadow:0 4px 16px rgba(56,189,248,.3)}
.tp-btn:hover{filter:brightness(1.08)}
.tp-time{font-size:13px;color:var(--ink);display:flex;gap:5px;align-items:baseline;min-width:118px}
.tp-time .sep{color:var(--ink4)}.tp-time .tot{color:var(--ink3)}
.tp-scrub{flex:1;padding:10px 0;cursor:pointer}
.tp-track{position:relative;height:5px;border-radius:4px;background:var(--line2)}
.tp-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--active),var(--exec))}
.tp-knob{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.tp-frame{font-size:12px;color:var(--ink2)}.tp-frame span{color:var(--ink4)}
.tp-speed{display:flex;gap:4px}
.tp-speed .sp{font-family:var(--mono);font-size:11px;color:var(--ink3);background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:5px 8px}
.tp-speed .sp.on{color:#06121c;background:var(--ink);border-color:var(--ink);font-weight:600}

/* scrollbar */
.tiles::-webkit-scrollbar{width:10px}
.tiles::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--bg)}
.tiles::-webkit-scrollbar-track{background:transparent}

@media (max-width:820px){
  .layout-a .detail-grid,.layout-b .detail-grid,.layout-c .detail-grid{grid-template-columns:1fr 1fr;grid-template-rows:240px 240px 300px 260px;
    grid-template-areas:"rgb depth" "tactile tactile" "traj traj" "ramps ramps"!important}
  .dofmap{display:none}
}
</style>
<style>
/* extras do modo LIVE */
.wait{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:var(--ink3);font-size:12px;letter-spacing:.03em}
.live-status{gap:14px}
.rec-dot{width:12px;height:12px;border-radius:50%;background:var(--exec);box-shadow:0 0 12px rgba(52,211,153,.7);animation:pulse 1.4s ease-in-out infinite}
.rec-dot.off{background:var(--bad);box-shadow:none;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.media-body .rgb-canvas,.depth-body .depth-img{object-fit:contain}
/* layout LIVE: sem trajetória 3D. Em cima RGB · Depth · Tátil (3 painéis iguais);
   embaixo as rampas (2 colunas) + o bloco de conexões. */
.live-grid .detail-grid{
  grid-template-columns:1fr 1fr 1fr;
  grid-template-rows:minmax(0,1fr) minmax(0,0.82fr);
  grid-template-areas:"rgb depth tactile" "ramps ramps conn";
}
.cell-conn{grid-area:conn;flex-direction:column;gap:12px}
.cell-conn>.estado-panel{flex:none}
@media (max-width:820px){
  .live-grid .detail-grid{grid-template-columns:1fr 1fr;grid-template-rows:280px 280px 320px 160px;
    grid-template-areas:"rgb depth" "tactile tactile" "ramps ramps" "conn conn"!important}
}
/* bloco de conexões (grande) */
.conn-panel .conn-body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:30px;padding:18px 30px}
.conn-row{display:flex;align-items:center;gap:20px}
.conn-dot{width:30px;height:30px;border-radius:50%;flex:none;background:var(--ink4)}
.conn-dot.on{background:var(--exec);box-shadow:0 0 22px rgba(52,211,153,.85);animation:pulse 1.6s ease-in-out infinite}
.conn-dot.off{background:var(--bad);box-shadow:0 0 18px rgba(246,112,138,.6)}
.conn-dot.unk{background:var(--line3)}
.conn-name{font-size:21px;font-weight:500;color:var(--ink);letter-spacing:.01em}
.conn-state{margin-left:auto;font-size:15px;letter-spacing:.04em}
.conn-state.on{color:var(--exec)} .conn-state.off{color:var(--bad)} .conn-state.unk{color:var(--ink3)}
/* estado do robô (bloqueado / desbloqueado) — bloco separado acima de Conexões */
.estado-body{display:flex;flex-direction:column;gap:10px;padding:16px 22px}
.estado-pill{display:flex;align-items:center;gap:16px;padding:16px 22px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2)}
.estado-pill.on{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.08)}
.estado-pill.off{border-color:rgba(246,112,138,.55);background:rgba(246,112,138,.10)}
.estado-pill.warn{border-color:rgba(245,158,11,.55);background:rgba(245,158,11,.10)}
.estado-dot{width:26px;height:26px;border-radius:50%;flex:none;background:var(--ink4)}
.estado-dot.on{background:var(--exec);box-shadow:0 0 20px rgba(52,211,153,.85);animation:pulse 1.6s ease-in-out infinite}
.estado-dot.off{background:var(--bad);box-shadow:0 0 16px rgba(246,112,138,.7)}
.estado-dot.warn{background:var(--filt);box-shadow:0 0 16px rgba(245,158,11,.7);animation:pulse 1.2s ease-in-out infinite}
.estado-txt{font-size:24px;font-weight:700;letter-spacing:.02em}
.estado-pill.on .estado-txt{color:var(--exec)} .estado-pill.off .estado-txt{color:var(--bad)} .estado-pill.warn .estado-txt{color:var(--filt)}
.estado-hint{font-size:13px;color:var(--ink3);letter-spacing:.02em;padding-left:2px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ov_data.jsx"></script>
