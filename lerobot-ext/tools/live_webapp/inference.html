<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniView · Inference Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06090f; --bg2:#080c13; --panel:#0c111a; --panel2:#0e141e; --panelhi:#121a26;
  --line:#19222f; --line2:#243140; --ink:#dbe6f2; --ink2:#8294aa; --ink3:#566578; --ink4:#3a4656;
  --cyan:#22d3ee; --cyan-dim:#0e7490; --amber:#ff9e3d; --amber-dim:#b45309;
  --cmd:#22d3ee; --filt:#f59e0b; --exec:#34d399; --good:#34d399; --warn:#ff9e3d; --bad:#f25f5c;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --disp:'Chakra Petch',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--disp);
  background-image:
    linear-gradient(transparent 0,transparent calc(100% - 1px),rgba(34,211,238,.025) 100%),
    linear-gradient(90deg,transparent 0,transparent calc(100% - 1px),rgba(34,211,238,.025) 100%),
    radial-gradient(1200px 700px at 70% -10%,rgba(34,211,238,.06),transparent 60%),
    radial-gradient(900px 600px at 10% 110%,rgba(255,158,61,.05),transparent 55%);
  background-size:34px 34px,34px 34px,100% 100%,100% 100%;
  overflow:hidden;
}
#root{height:100vh}
.app{display:flex;flex-direction:column;height:100vh;padding:14px 16px 12px;gap:12px}

/* ───────── top bar ───────── */
.top{display:flex;align-items:center;gap:18px;flex:none;
  border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,var(--panel2),var(--panel));
  padding:11px 16px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.4)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.reactor{width:30px;height:30px;flex:none;border-radius:50%;position:relative;
  background:radial-gradient(circle at 50% 50%,rgba(34,211,238,.25),transparent 62%);
  border:1.5px solid var(--cyan);box-shadow:0 0 16px rgba(34,211,238,.45),0 0 4px rgba(34,211,238,.6) inset}
.reactor::before{content:"";position:absolute;inset:7px;border-radius:50%;border:1.5px solid rgba(34,211,238,.55);
  border-top-color:transparent;border-left-color:transparent;animation:spin 3.4s linear infinite}
.reactor::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(34,211,238,.18);
  animation:pulse 2.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,211,238,.18)}50%{box-shadow:0 0 0 5px rgba(34,211,238,0)}}
.title{display:flex;flex-direction:column;line-height:1.05}
.title b{font-weight:700;font-size:17px;letter-spacing:.16em;text-transform:uppercase;
  background:linear-gradient(90deg,#e8f4ff,#9fdcec);-webkit-background-clip:text;background-clip:text;color:transparent}
.title small{font-family:var(--mono);font-size:9.5px;letter-spacing:.28em;color:var(--ink3);text-transform:uppercase}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink2);background:var(--bg2);
  border:1px solid var(--line);border-radius:7px;padding:5px 9px;white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.chip.phase{border-color:var(--line2)}
.chip.phase .pdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle;
  background:var(--good);box-shadow:0 0 8px currentColor;color:var(--good)}
.chip.phase.warn .pdot{background:var(--warn);color:var(--warn)} .chip.phase.off .pdot{background:var(--bad);color:var(--bad)}
.spacer{flex:1}
.leds{display:flex;gap:14px;align-items:center;padding-right:4px}
.led{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink2)}
.led .d{width:7px;height:7px;border-radius:50%;background:var(--ink4)}
.led.on .d{background:var(--good);box-shadow:0 0 9px var(--good)} .led.on{color:var(--ink)}
.led.off .d{background:var(--bad);box-shadow:0 0 9px var(--bad)}
.led.unk .d{background:var(--ink4)}

/* ───────── grasp gauge (header) ───────── */
.grasp{display:flex;align-items:center;gap:13px;border-left:1px solid var(--line);padding-left:16px}
.grasp .lbl{display:flex;flex-direction:column;line-height:1.1}
.grasp .lbl b{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.16em;color:var(--amber);text-transform:uppercase}
.grasp .lbl small{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--ink3)}
.gauge{display:flex;flex-direction:column;gap:4px}
.gmeter{position:relative;width:170px;height:18px;background:var(--bg2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.gmeter .fill{position:absolute;inset:0;width:0;background:linear-gradient(90deg,#7a4408,var(--amber));
  box-shadow:0 0 14px rgba(255,158,61,.5);transition:width 70ms linear}
.gmeter .ticks{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,transparent 0 16px,rgba(6,9,15,.85) 16px 17px)}
.gnum{font-family:var(--mono);font-weight:600;font-size:21px;color:var(--amber);min-width:54px;text-align:right;
  text-shadow:0 0 14px rgba(255,158,61,.4);font-variant-numeric:tabular-nums}
.gtrig{font-family:var(--mono);font-size:9px;color:var(--ink2);letter-spacing:.04em}
.gtrig b{color:var(--cyan)}
.spark{display:block;width:170px;height:18px}

/* ───────── grid ───────── */
.grid{flex:1;min-height:0;display:grid;gap:12px;
  grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1.08fr 1.15fr}
.cell{min-width:0;min-height:0;opacity:0;transform:translateY(10px);animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards}
.cell.cmd-wide{grid-column:1 / -1}
.cell.traj-wide{grid-column:1 / -1}
/* ── trajetória 3D (painel do efetuador) ── */
.traj-panel .traj-wrap{flex:1;min-height:0}
.traj-wrap{position:relative;width:100%;height:100%}
.traj-canvas{width:100%;height:100%;display:block;touch-action:none}
.traj-legend{position:absolute;top:9px;left:11px;display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:9.5px;color:var(--ink2)}
.traj-legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.traj-legend i{width:14px;height:2.5px;border-radius:2px;flex:none}
.traj-legend i.dash{background:none!important;border-top:2px dashed #f59e0b;height:0}
.traj-hint{position:absolute;bottom:8px;right:10px;font-family:var(--mono);font-size:9px;color:var(--ink4)}
.armsel{display:flex;gap:4px;margin-left:10px}
.armbtn{font:600 11px/1 ui-sans-serif,system-ui;letter-spacing:.3px;color:var(--ink3);background:var(--bg2);
  border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer;transition:.12s}
.armbtn:hover{color:var(--ink2);border-color:var(--line2)}
.armbtn.on{color:#08121c;background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px rgba(34,211,238,.35)}
.cell:nth-child(1){animation-delay:.04s}.cell:nth-child(2){animation-delay:.10s}.cell:nth-child(3){animation-delay:.16s}
.cell:nth-child(4){animation-delay:.22s}.cell:nth-child(5){animation-delay:.28s}.cell:nth-child(6){animation-delay:.34s}
.cell:nth-child(7){animation-delay:.40s}
@keyframes rise{to{opacity:1;transform:none}}

/* ───────── panel ───────── */
.pnl{height:100%;display:flex;flex-direction:column;position:relative;
  background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:11px;overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.025) inset,0 14px 34px rgba(0,0,0,.34)}
.pnl::before,.pnl::after{content:"";position:absolute;width:11px;height:11px;pointer-events:none;z-index:3;opacity:.55}
.pnl::before{top:7px;left:7px;border-top:1.5px solid var(--cyan);border-left:1.5px solid var(--cyan)}
.pnl::after{bottom:7px;right:7px;border-bottom:1.5px solid var(--cyan);border-right:1.5px solid var(--cyan)}
.pnl.amber::before{border-color:var(--amber)}.pnl.amber::after{border-color:var(--amber)}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;
  padding:8px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panelhi),transparent)}
.ptag{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:600;font-size:11.5px;
  letter-spacing:.15em;text-transform:uppercase;color:var(--ink)}
.ptag i{width:3px;height:13px;border-radius:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.pnl.amber .ptag i{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.pmeta{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink3);text-align:right;white-space:nowrap}
.pbody{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#05080d;overflow:hidden}
.pbody img.feed{width:100%;height:100%;object-fit:contain;display:block;background:#05080d}
.wait{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.08em}
.wait::after{content:"";display:inline-block;width:5px;height:5px;margin-left:7px;border-radius:50%;background:var(--ink3);animation:blink 1s steps(2) infinite;vertical-align:middle}
@keyframes blink{50%{opacity:.2}}

/* media overlays */
.badge{position:absolute;top:8px;right:9px;z-index:2;font-family:var(--mono);font-size:8.5px;font-weight:600;
  letter-spacing:.16em;color:var(--cyan);background:rgba(5,8,13,.7);border:1px solid rgba(34,211,238,.4);
  border-radius:5px;padding:2px 7px}
.badge .ld{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--cyan);margin-right:5px;
  box-shadow:0 0 7px var(--cyan);animation:blink 1.1s steps(2) infinite;vertical-align:middle}
.badge.amber{color:var(--amber);border-color:rgba(255,158,61,.4)}.badge.amber .ld{background:var(--amber);box-shadow:0 0 7px var(--amber)}
.scan{display:none}
/* atenção: wrapper na proporção do RGB (centra no painel) + clip do heatmap padado */
.attwrap{position:relative;max-width:100%;max-height:100%;margin:auto}
.attwrap img{border-radius:0}
.heatclip{position:absolute;inset:0;overflow:hidden;pointer-events:none}
/* depth scale */
.dscale{position:absolute;left:10px;right:10px;bottom:9px;z-index:2;display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:8.5px;color:var(--ink2)}
.dscale .bar{flex:1;height:6px;border-radius:3px;border:1px solid var(--line2);
  background:linear-gradient(90deg,#b91c1c,#f59e0b,#22c55e,#0891b2,#1e3a8a)}

/* ramps panel */
.rcontrols{display:flex;align-items:center;gap:8px}
.rtab{font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;color:var(--ink2);background:var(--bg2);
  border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}
.rtab.on{color:#06121c;background:var(--cyan);border-color:var(--cyan)}
.rtab.masked{opacity:.45}
.rleg{display:flex;gap:9px}
.sig{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;color:var(--ink3);
  background:none;border:none;cursor:pointer}
.sig i{width:9px;height:9px;border-radius:2px;border:1.5px solid currentColor;display:inline-block}
.sig.on{color:var(--ink)}
.ramps-canvas{display:block;width:100%;height:100%}
.rfoot{flex:none;padding:4px 12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:8.5px;color:var(--ink4)}

/* footer */
.foot{flex:none;display:flex;align-items:center;gap:16px;padding:7px 14px;
  border:1px solid var(--line);border-radius:10px;background:var(--panel);font-family:var(--mono);font-size:10px;color:var(--ink2)}
.foot .rec{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.foot .rec.on{background:var(--good);box-shadow:0 0 10px var(--good);animation:blink 1.4s steps(2) infinite}
.foot b{color:var(--ink)}
.foot .sp{flex:1}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script type="text/babel" src="ov_data.jsx?v=3"></script>
<script type="text/babel" src="ov_ramps.jsx?v=3"></script>
<script type="text/babel" src="ov_traj.jsx?v=1"></script>
<script type="text/babel" src="inference_app.jsx?v=3"></script>
</body>
</html>
