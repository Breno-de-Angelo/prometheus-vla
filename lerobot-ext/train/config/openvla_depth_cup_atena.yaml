# OpenVLA-Depth — treino na atena com o dataset local pick_up_the_cup_2026-06-09.
#
# ┌─ LEIA ANTES DE RODAR ──────────────────────────────────────────────────────┐
# │ Este dataset tem UMA tarefa só ("pick up the cup", 36 episódios).          │
# │                                                                            │
# │ Ou seja: este treino NÃO produz o comportamento multi-tarefa que motivou a │
# │ política. O modelo vai ver sempre o mesmo prompt e vai aprender a ignorá-lo.│
# │                                                                            │
# │ O que este run entrega de útil:                                            │
# │   • valida a pilha inteira (carregamento do 7B, LoRA, head OFT, depth)     │
# │   • dá um baseline de val_loss comparável com o pi05depth no mesmo robô    │
# │   • mede o tempo real por step para você dimensionar o run multi-tarefa    │
# │                                                                            │
# │ Para multi-tarefa de verdade, grave demos de outros comandos               │
# │ ("place the cup on the coffee stand", ...) com a string de `task`          │
# │ correspondente e use openvla_depth_multitask.yaml.                         │
# └────────────────────────────────────────────────────────────────────────────┘
#
# Preparo (uma vez, na atena):
#   source ~/miniconda3/bin/activate g1
#   pip install 'timm>=1.0.0,<1.1.0' 'peft>=0.13.0'
#   python -m policies.openvla_depth.backbone --inspect openvla/openvla-7b
#
# Rodar — a GPU 0 é a única livre (a 1 está com vLLM, a 2 com ollama):
#   cd ~/DEV/prometheus-vla/lerobot-ext
#   CUDA_VISIBLE_DEVICES=0 python init_lerobot_train_v3.py \
#       --config_path=train/config/openvla_depth_cup_atena.yaml
#
# Smoke test antes do run longo (sobrescreve o YAML pela CLI):
#   CUDA_VISIBLE_DEVICES=0 python init_lerobot_train_v3.py \
#       --config_path=train/config/openvla_depth_cup_atena.yaml \
#       --steps=30 --eval_freq=15 --save_freq=1000 --batch_size=4 --wandb.enable=false

dataset:
  # Dataset local: `root` aponta para a pasta, `repo_id` é só o rótulo.
  # Sem `root`, o LeRobot tentaria baixar do Hub e falharia.
  repo_id: "local/pick_up_the_cup_2026-06-09"
  root: "meu_dataset/pick_up_the_cup_2026-06-09"
  # 30 de 36 episódios (12.861 frames). Os 6 de validação estão espalhados pela
  # gravação de propósito: os episódios iniciais são longos (~700 frames) e os
  # finais curtos (~280), então validar só nos últimos mediria a tarefa errada.
  episodes: [0, 1, 2, 3, 5, 6, 7, 8, 9, 10, 12, 13, 14, 15, 16,
             18, 19, 20, 21, 22, 24, 25, 26, 27, 28, 30, 31, 32, 33, 35]
  image_transforms:
    enable: true
    max_num_transforms: 3
    random_order: false

val_dataset:
  repo_id: "local/pick_up_the_cup_2026-06-09"
  root: "meu_dataset/pick_up_the_cup_2026-06-09"
  # 6 episódios / 2.674 frames (17%), cobrindo demos longas e curtas.
  episodes: [4, 11, 17, 23, 29, 34]

output_dir: "/home/hercules/DEV/prometheus-vla/lerobot-ext/train/output/openvla_depth_cup_2026-06-09"
job_name: "openvla_depth_cup_2026-06-09"

policy:
  type: openvladepth
  pretrained_backbone: openvla/openvla-7b
  load_mode: native            # 'remote_code' exigiria transformers==4.40.1
  dtype: bfloat16
  push_to_hub: false

  # Dataset de tarefa única — a checagem só avisa, não aborta.
  # No config multi-tarefa isto vira `true`.
  require_multitask: false
  # override_task: NUNCA preencher. Forçaria um prompt fixo e mataria o
  # condicionamento por linguagem de vez.

  chunk_size: 50
  n_action_steps: 50

  # Head OFT: 1 forward por chunk em vez de 28×50 = 1400 tokens autoregressivos.
  action_head_hidden_dim: 1024
  action_head_n_layers: 3
  bidirectional_action_attn: true
  loss_type: l1

  # Fusão multimodal — o dataset tem todas estas features:
  #   observation.images.head_camera        [480, 848, 3]  vídeo
  #   observation.images.head_camera_depth  [480, 848, 3]  vídeo (cinza triplicado)
  #   observation.state                     [28]
  #   observation.left_hand_pressure        [33]
  #   observation.right_hand_pressure       [33]
  use_depth_3d: true
  depth_encoder_type: point_transformer
  pointnet_num_points: 1024
  state_as_token: true

  # ⚠️ DESLIGADO DE PROPÓSITO — os sensores táteis não gravaram neste dataset.
  #
  # Verificado no meta/stats.json: `left_hand_pressure` e `right_hand_pressure`
  # são identicamente ZERO nos 36 episódios (min=max=mean=std=0, nos 33 sensores
  # de cada mão). As colunas existem no parquet, mas não há sinal nenhum.
  #
  # Com use_pressure: true isso não quebra — o normalizador troca o denominador
  # zero por epsilon e o vetor vira uma constante -1.0 — mas gastaria um token do
  # contexto para carregar uma constante, e daria a falsa impressão de que a
  # fusão tátil está contribuindo.
  #
  # Volte para `true` quando gravar um dataset com o sensor funcionando
  # (os commits "Integrando sensor mão direita" apontam nessa direção).
  use_pressure: false

  # ⚠️ ATENÇÃO — estes valores são estimados, MEÇA os reais.
  #
  # Os configs de pi05depth/actdepth usam cx=320, cy=240, que corresponde a uma
  # câmera de 640×480. Este dataset foi gravado a **848×480**
  # (Scripts_Prometheus_int/full_realsenser_server.py), com o depth alinhado ao
  # stream de COR. O ponto principal real fica em cx ≈ 424, não 320 — um erro de
  # ~104 px que cisalha a nuvem de pontos proporcionalmente à distância.
  #
  # Valores abaixo derivados do FOV nominal do D435i (69° H) a 848×480.
  # Para obter os reais, rode no robô:
  #   python Scripts_Prometheus_int/print_camera_intrinsics.py
  camera_intrinsics:
    fx: 617.0
    fy: 617.0
    cx: 424.0
    cy: 240.0

  # LoRA — setup do paper OpenVLA. Em A100 80GB sobra folga.
  use_lora: true
  lora_r: 32
  lora_alpha: 16
  freeze_vision_encoder: true
  gradient_checkpointing: true

  optimizer_lr: 5.0e-4               # adaptadores LoRA
  optimizer_lr_new_modules: 1.0e-3   # point transformer / tato / estado / queries / head
  optimizer_grad_clip_norm: 1.0
  scheduler_warmup_steps: 300
  scheduler_decay_steps: 11000
  scheduler_decay_lr: 5.0e-5

# 12.861 frames de treino ÷ 16 ≈ 804 steps por época.
# 12.000 steps ≈ 15 épocas. Meça o tempo por step no smoke test antes de soltar:
# a 2 s/step isso dá ~6h40 na A100.
batch_size: 16
steps: 12000

log_freq: 10
eval_freq: 400          # ~a cada meia época
save_freq: 2000
save_best_checkpoint: true   # use best_val_checkpoint/ para deploy, não o último

wandb:
  enable: true
  project: prometheus_g1
