# pi05 vanilla on ManiSkill3 PickCube-v1 (RGB + state, no depth).
#
# Pair with: pi05_depth_maniskill_pickcube.yaml for the depth ablation.
# Dataset is built by scripts/convert_maniskill_to_lerobot.py from the
# motion-planning demos shipped by ManiSkill3.

dataset:
  repo_id: local/maniskill_pickcube_v1
  root: /data/huggingface-models/lerobot/local/maniskill_pickcube_v1
  episodes: null  # use all episodes the converter wrote (set explicitly for ablations)
  image_transforms:
    enable: true
    max_num_transforms: 3
    random_order: false

val_dataset:
  repo_id: local/maniskill_pickcube_v1
  root: /data/huggingface-models/lerobot/local/maniskill_pickcube_v1
  episodes: null

output_dir: /home/hercules/prometheus-vla/train/output/pi05_vanilla_maniskill_pickcube
job_name: pi05_vanilla_maniskill_pickcube

policy:
  type: pi05
  pretrained_path: lerobot/pi05_base
  compile_model: false
  gradient_checkpointing: true
  dtype: bfloat16
  freeze_vision_encoder: false
  train_expert_only: true
  push_to_hub: false

log_freq: 50
eval_freq: 1000
save_freq: 2000
batch_size: 8
steps: 10000
num_workers: 4

wandb:
  enable: true
  project: prometheus_maniskill
