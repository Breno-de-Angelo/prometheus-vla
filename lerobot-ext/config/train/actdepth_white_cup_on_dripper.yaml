# ==========================================================
# TREINO — ACT-D no dataset white_cup_on_dripper (2026-08-11)
#
# Primeiro treino no formato de profundidade NOVO: mapa de 1 canal em
# milímetros, gravado pelo `DepthEncoderConfig` da 0.6.1. Ver as diferenças
# marcadas com "MUDOU" abaixo — copiar um YAML antigo por cima disto treina
# com a geometria errada e não avisa.
#
#   cd lerobot-ext
#   python -m policies.act_depth.run_train \
#       --config_path=config/train/actdepth_white_cup_on_dripper.yaml
# ==========================================================

# ==========================================================
# 1. DATASET
# ==========================================================
# 27 episódios gravados (0–26). O 26 tem 6 quadros (0,2 s) — tomada abortada,
# fica de fora. Três episódios ficam reservados para validação.
dataset:
  repo_id: Mrwlker/white_cup_on_dripper_2026-08-11
  root: meu_dataset/white_cup_on_dripper_2026-08-11
  episodes: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 12, 13, 14, 15, 16, 17, 18, 20, 21, 22, 23, 24, 25]

  image_transforms:
    enable: true
    max_num_transforms: 1
    tfs:
      ColorJitter:
        type: ColorJitter
        weight: 1.0
        kwargs:
          brightness: [0.8, 1.2]
          contrast: [0.8, 1.2]
          saturation: [0.5, 1.5]
          hue: [-0.05, 0.05]

val_dataset:
  repo_id: Mrwlker/white_cup_on_dripper_2026-08-11
  root: meu_dataset/white_cup_on_dripper_2026-08-11
  episodes: [2, 11, 19]

# ==========================================================
# 2. ARQUITETURA (ACT-D)
# ==========================================================
policy:
  type: actdepth
  repo_id: Mrwlker/white_cup_on_dripper_actdepth
  push_to_hub: false

  input_features:
    observation.images.head_camera:
      type: VISUAL
      shape: [3, 480, 848]

    # MUDOU: 1 canal, não 3. O dataset guarda mapa de profundidade nativo
    # (`is_depth_map`), e o LeRobot o entrega como [1, H, W] float32 em
    # MILÍMETROS. Declarar 3 aqui faz o batch não bater com o tensor.
    observation.images.head_camera_depth:
      type: VISUAL
      shape: [1, 480, 848]

    # MUDOU: 29 dims (14 braços + yaw da cintura + 14 das mãos Dex3).
    # Os datasets antigos tinham 28 — sem o yaw do tronco.
    observation.state:
      type: STATE
      shape: [29]

    # A pressão das mãos NÃO entra: as 66 colunas do dataset são
    # identicamente zero (min=max=mean=std=0 no stats.json). O sensor não
    # chegou a publicar. Ligar isso só gasta um token com uma constante e dá
    # a impressão falsa de que a fusão tátil está ativa.

  output_features:
    action:
      type: ACTION
      shape: [29]

  chunk_size: 100          # 100 passos a 30 fps ≈ 3,3 s de ação por predição
  n_action_steps: 100
  n_obs_steps: 1
  use_amp: true

  # ── Nuvem de pontos 3D ─────────────────────────────────
  use_depth_3d: true
  depth_unit: mm           # MUDOU: unidade em que o dataset entrega o depth
  # MUDOU: intrínsecos do stream de COR a 848×480 (o depth é alinhado a ele).
  # Os antigos (cx=320, cy=240) eram de uma imagem de 640 px de largura.
  # Estes vêm do FOV nominal do D435i; para os reais rode NO ROBÔ
  # `Scripts_Prometheus_int/print_camera_intrinsics.py` e cole aqui.
  camera_intrinsics:
    fx: 617.0
    fy: 617.0
    cx: 424.0
    cy: 240.0
  pointnet_num_points: 1024

  use_pressure: false
  pressure_feature_dim: 66
  pressure_hidden_dim: 256

  scene_uncertainty_threshold: 0.0

  # ── Anti-overfitting (23 episódios é pouco) ────────────
  dropout: 0.1
  optimizer_weight_decay: 1e-4
  kl_weight: 10.0

  # ── Transformer ────────────────────────────────────────
  dim_model: 512
  n_heads: 4
  dim_feedforward: 3200
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  latent_dim: 32
  n_vae_encoder_layers: 4

  vision_backbone: resnet18
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1

# ==========================================================
# 3. TREINAMENTO
# ==========================================================
output_dir: "train_output/actdepth_white_cup_on_dripper"
steps: 100000

# batch_size 8, não 32: esta máquina tem 8 GB de VRAM, e cada amostra carrega
# RGB 480×848 pela ResNet18 mais 1024 pontos pela PointNet. Com 32 estoura.
batch_size: 8
num_workers: 4
log_freq: 50
save_freq: 5000
save_checkpoint: true
save_best_checkpoint: true

early_stop_patience: 0
early_stop_min_delta: 0.001
neutral_position_loss_weight: 0.0

# ==========================================================
# 4. AVALIAÇÃO E LOGS
# ==========================================================
eval_freq: 250

wandb:
  enable: false
  project: prometheus_g1
  disable_artifact: true
