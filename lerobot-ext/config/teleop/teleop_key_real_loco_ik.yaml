# Teleoperação por TECLADO no ROBÔ REAL, modo HIGH LEVEL/LOCO (WBC ativo),
# com IK — cada mão é uma pose 6D em vez de junta por junta.
#
# Pré-requisito: no robô, `./init_prometheus-vla.sh` já rodando com
# USE_LOCO=true (ver o log: "Modo 'loco' será informado na porta 6004").
#
# Rodar (SEM --sim — robô real):
#
#   cd lerobot-ext
#   python init_lerobot_teleoparate_v2.py --config_path=config/teleop/teleop_key_real_loco_ik.yaml
#
# ┌─ TECLAS ─────────────────────────────────────────────────┐
# │ MÃO ESQ   W S frente/trás   A D lados   R F cima/baixo   │
# │ MÃO DIR   I K frente/trás   J L lados   Y H cima/baixo   │
# │ SHIFT     mesmas teclas GIRAM em vez de transladar       │
# │ MÃOS      Z fecha esquerda        M fecha direita        │
# │ TRONCO    , esquerda              . direita              │
# └──────────────────────────────────────────────────────────┘
#
# A janela do pygame ("Controle G1 - clique aqui para focar") precisa estar
# EM FOCO — sem foco o SDL não entrega tecla nenhuma no Wayland.
#
# O tronco NÃO passa pela IK: ela trava as juntas de cintura, então o yaw
# continua sendo comandado direto pelas teclas , e . — igual no modo junta.

robot:
  type: unitree_g1_dex3
  robot_ip: "192.168.68.71"

  # true → control_mode vira "high_level" sozinho (ver __post_init__ de
  # UnitreeG1Dex3Config). Precisa bater com o --loco do dex3_g1_server_v2.py
  # que já está rodando no robô — senão os dois lados esperam tópicos
  # diferentes (rt/arm_sdk x rt/lowcmd).
  use_loco: true

  # Yaw do tronco no vetor de ação (28 → 29 dims com as mãos). Ver
  # docs/SCHEMA_G1_V2.md — roll e pitch da cintura ficam travados.
  use_waist_yaw: true
  waist_yaw_limit: 1.0

  # Câmera de pulso direito (right_arm_realsense_server.py, porta 5556).
  # Deixe false se esse servidor não estiver rodando no robô.
  use_wrist_camera: true

teleop:
  type: keyboard_g1_arm
  mode: ik

  # Passo por frame. A 60 fps, 0.005 m dá 30 cm/s com a tecla segurada —
  # rápido o bastante para posicionar sem virar solavanco.
  ik_lin_speed: 0.005
  ik_ang_speed: 0.02

  waist_speed: 0.01
  waist_yaw_limit: 1.0
