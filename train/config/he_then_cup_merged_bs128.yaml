# Finetune pi05-D full fusion no copo merjado — variante BATCH 128.
# LR escalado (2.5e-5 -> 1e-4, regra linear 4x) e steps cortados (50k -> 13k,
# ~mesmas ~180 epocas do batch 32) p/ aproveitar o batch sem aumentar o overfit.
dataset:
  repo_id: "lewislf/pick_up_the_cup_merged"
  root: "/data/huggingface-models/lerobot/lewislf/pick_up_the_cup_merged"
  episodes: [0,1,2,3,4,5,6,8,10,11,12,13,14,15,16,17,20,21,22,24,25,26,27,28,29,30,31,32,34,35,36,37,38,40,41,42,43,44]
  video_backend: pyav
  image_transforms:
    enable: true
    max_num_transforms: 3
    random_order: false

val_dataset:
  repo_id: "lewislf/pick_up_the_cup_merged"
  root: "/data/huggingface-models/lerobot/lewislf/pick_up_the_cup_merged"
  episodes: [7, 9, 18, 19, 33, 39, 45, 46]
  video_backend: pyav

output_dir: "/home/hercules/prometheus-vla/train/output/he_then_cup_merged_bs128"
job_name: "he_then_cup_merged_bs128"

policy:
  type: pi05
  pretrained_path: /home/hercules/prometheus-vla/train/output/he_pretrain_depth/checkpoints/last/pretrained_model
  compile_model: false
  gradient_checkpointing: true
  dtype: bfloat16
  freeze_vision_encoder: false
  train_expert_only: true
  push_to_hub: false
  optimizer_lr: 1.0e-4
  scheduler_warmup_steps: 50
  scheduler_decay_steps: 13000
  scheduler_decay_lr: 1.0e-5

depth_fusion: true
fusion_mode: full

tolerance_s: 0.01
log_freq: 10
eval_freq: 500
save_freq: 500
batch_size: 128
steps: 13000

wandb:
  enable: true
