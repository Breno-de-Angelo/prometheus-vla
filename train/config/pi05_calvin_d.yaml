# pi05-D depth_only on CALVIN ABC.
# PointNet over observation.depths.static; no pressure_proj (CALVIN has no
# tactile sensors). Comparison head-to-head with pi05_calvin_vanilla.

dataset:
  repo_id: "local/calvin_abc_lerobot_depth"
  image_transforms:
    enable: true
    max_num_transforms: 3
    random_order: false

val_dataset:
  repo_id: "local/calvin_abc_lerobot_depth"

output_dir: "/home/hercules/prometheus-vla/train/output/pi05_calvin_d"
job_name: "pi05_calvin_d"

policy:
  type: pi05
  pretrained_path: lerobot/pi05_base
  compile_model: false
  gradient_checkpointing: true
  dtype: bfloat16
  freeze_vision_encoder: false
  train_expert_only: true
  push_to_hub: false

depth_fusion: true
fusion_mode: depth_only
depth_key: observation.depths.static
depth_scale: 1.0

log_freq: 50
eval_freq: 2000
max_val_batches: 200
save_freq: 2000
batch_size: 4
steps: 30000
seed: 1000
num_workers: 4

wandb:
  enable: true
  project: lerobot
