# Robot Configuration
ROBOT_TYPE: 'g1_29dof'
ROBOT_SCENE: "assets/scene_43dof.xml"

# DDS Communication
DOMAIN_ID: 0
INTERFACE: "lo"  # "lo" for simulation, network interface with "192.168.123.222" for real robot
SIMULATOR: "mujoco"

# Joystick (auto-detected at startup; these are defaults when a controller is found)
JOYSTICK_TYPE: "xbox"  # "xbox" or "switch"
JOYSTICK_DEVICE: 0

# Simulation Settings
FREE_BASE: False
enable_waist: False  # False = band on torso, True = band on pelvis
ENABLE_ELASTIC_BAND: True

# Timing
SIMULATE_DT: 0.004  # 250Hz physics
VIEWER_DT: 0.02     # 50Hz viewer update
IMAGE_DT: 0.033333  # ~30Hz camera

# Rendering
ENABLE_ONSCREEN: true
ENABLE_OFFSCREEN: true
MP_START_METHOD: "spawn"

# Sensors
USE_SENSOR: False
PRINT_SCENE_INFORMATION: True

# Ruído procedural no depth pra aproximar a Intel RealSense D435 (sim2real).
# O MuJoCo gera depth geométrico perfeito; isto injeta ruído axial (~quadrático
# em z), buracos de borda, dropout e clip de alcance. Override rápido por env:
# G1_DEPTH_NOISE=0 desliga, G1_DEPTH_NOISE=1 liga (tem precedência sobre 'enabled').
DEPTH_NOISE:
  enabled: true
  z_min: 0.2            # alcance mínimo útil da D435 (m); abaixo -> inválido (0)
  z_max: 3.0            # alcance máx. confiável (m); acima -> inválido (0)
  baseline_m: 0.05      # baseline do par stereo (~50 mm)
  subpix_sigma: 0.08    # desvio do ruído de disparidade (px) -> erro axial
  quantize: true        # quantiza disparidade (resolução cai com z²)
  subpix_levels: 8      # passos de sub-pixel (1/8 px)
  edge_thresh_m: 0.02   # salto de profundidade que vira borda/buraco (m)
  edge_dilate: 1        # dilatação do halo de buracos (px)
  p_dropout: 0.001      # fração de pixels válidos zerados (speckle)
  lateral_sigma_px: 0.0 # jitter lateral (0 = off; custa caro)
  seed: 0

# Robot Dimensions
NUM_MOTORS: 29
NUM_JOINTS: 29
NUM_HAND_MOTORS: 7
NUM_HAND_JOINTS: 7

# Torque Limits (Nm) - 29 body + 14 hand = 43 total
motor_effort_limit_list: [
    88.0, 88.0, 88.0, 139.0, 50.0, 50.0,   # left leg
    88.0, 88.0, 88.0, 139.0, 50.0, 50.0,   # right leg
    88.0, 50.0, 50.0,                       # waist
    25.0, 25.0, 25.0, 25.0, 25.0, 5.0, 5.0, # left arm
    2.45, 0.7, 0.7, 0.7, 0.7, 0.7, 0.7,    # left hand
    25.0, 25.0, 25.0, 25.0, 25.0, 5.0, 5.0, # right arm
    2.45, 0.7, 0.7, 0.7, 0.7, 0.7, 0.7     # right hand
]
